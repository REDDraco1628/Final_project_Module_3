<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title> Copy Website </title>
    <script src="https://kit.fontawesome.com/46057189c5.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <section id="landing">
            <nav>
                <div class="container">
                    <div class="row">
                        <div class="nav__container">
                            <div class="title__container">
                                <img class="nav__logo" src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"></img>
                                <h2> Treact </h2>
                            </div>
                            <ul class="nav__list">
                                <li class="nav__links"><a href="#"> About </a></li>
                                <li class="nav__links"><a href="#">Blog </a></li>
                                <li class="nav__links"><a href="#"> Pricing </a></li>
                                <li class="nav__links"><a href="#"> Contact Us </a></li>
                            </ul>
                            <ul class="nav__list-2">
                                <li class="nav__links nav__last"><a href="#"> Login </a></li>
                                <li class="nav__links nav__last nav__link--primary"><a href="#"> Sign Up </a></li>
                            </ul>
                        </div>
                    </div>
                </div>    
            </nav>
            <div class="container">
                <div class="row__header">
                    <div class="text__area">
                        <h1> Beautiful React Templates <span class="text-purple"> for you. </span></h1>
                        <p> Our templates are easy to setup, understand and customize.  Fully modular components with a variety of pages and components.</p>
                        <div class="header__email">
                            <input type="text" class="header__email--input" placeholder="Your E-mail Address">
                            <button class="header__email--btn"> Get Started </button>
                        </div>
                        <p class="about__me--para--cust"> OUR TRUSTED CUSTOMERS </p>
                        <figure>
                            <img class="cust__img" src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png"></img>
                        </figure>
                    </div>
                    <figure>
                        <img class="header__img" src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg"></img>
                    </figure>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
